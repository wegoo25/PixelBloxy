name: Deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
      - name: Configure backend URL
        env:
          PIXELBLOXY_API_URL: ${{ vars.PIXELBLOXY_API_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_url = os.environ.get("PIXELBLOXY_API_URL", "").strip().rstrip("/")
          if api_url and not api_url.startswith("https://"):
              raise SystemExit("PIXELBLOXY_API_URL must be an https URL")

          Path("public/site-config.js").write_text(
              "window.PIXELBLOXY_API_URL = " + json.dumps(api_url) + ";\n",
              encoding="utf-8",
          )
          if not api_url:
              print("PIXELBLOXY_API_URL is empty; Shopify/chat APIs will not work on the static preview yet.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
